<!doctype html>
<html lang="es-VE">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>Mis entradas · Global Ticket</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 28 28%27%3E%3Crect width=%2728%27 height=%2728%27 rx=%276%27 fill=%27%233B5BFF%27/%3E%3Cpath d=%27M7 9h14v3a2 2 0 0 0 0 4v3H7v-3a2 2 0 0 0 0-4z%27 fill=%27white%27/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-nav="mis-entradas.html">
<main id="main">
 <div class="wrap narrow">
  <section style="padding-top:28px">
    <h1>Mis entradas</h1>
    <div class="magic" role="note"><p>Entraste con el enlace seguro enviado a <b>mar•••••@correo.example</b>. No necesitas contraseña. No compartas este enlace: abre tus QR.</p></div>
    <p style="margin-top:14px"><span class="offline">Guardadas en este teléfono: abren aunque no haya señal.</span></p>
  </section>
  <div class="tix-list" id="list"></div>
 </div>
</main>
<dialog class="door" id="door" aria-label="QR para la puerta">
  <p class="small muted" id="d-ev" style="margin-bottom:10px"></p>
  <div class="qr big" id="d-qr"></div>
  <p class="serial" id="d-ser" style="margin-bottom:4px"></p>
  <p class="small muted" style="margin-bottom:14px">Sube el brillo de tu pantalla. Muestra este QR en la puerta.</p>
  <form method="dialog"><button class="btn block" autofocus>Cerrar</button></form>
</dialog>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js" integrity="sha384-HOvlOYPIs/zjoIkWUGXkVmXsjr8GuZLV+Q+rcPwmJOVZVpvTSXQChiN4t9Euv9Vc" crossorigin="anonymous"></script>
<script src="js/app.js"></script>
<script>
(function(){
  const {EVENTS,qrSVG,artHTML,$,$$,esc,motion,usd,toast}=GT;
  const E=id=>EVENTS.find(e=>e.id===id);
  const T=[
    {ev:E("bolero"),s:E("bolero").sessions[0],area:"General",n:2,ser:"N° 48213",state:"ok"},
    {ev:E("salsa"),s:E("salsa").sessions[0],area:"Palapa",n:1,ser:"N° 47790",state:"ok"},
    {ev:E("gala"),s:E("gala").sessions[0],area:"Mesa VIP",n:1,ser:"N° 48302",state:"ver"},
  ];
  const html=T.map((t,i)=>Array.from({length:t.n},(_,k)=>{
      const ser=t.ser+"-0"+(k+1);
      return `<article class="pass" data-i="${i}" data-k="${k}">
        <div class="pass-ph">${artHTML(t.ev,"r1610")}<div class="over"><div class="tags">${t.state==="ok"?'<span class="tag ok">Lista para la puerta</span>':'<span class="tag pending">En verificación</span>'}</div><h2>${esc(t.ev.title)}</h2></div></div>
        <dl><div><dt>Fecha</dt><dd>${esc(t.s.day)} 2026</dd></div><div><dt>Puertas</dt><dd>${t.s.doors}</dd></div><div class="wide"><dt>Sede</dt><dd>${esc(t.s.venue)}</dd></div><div><dt>Área</dt><dd>${esc(t.area)}</dd></div><div><dt>Entrada</dt><dd>${k+1} de ${t.n}</dd></div></dl>
        <div class="pass-q">
          ${t.state==="ok"?`<div class="qr">${qrSVG(ser)}</div><p class="serial">${ser}</p><button class="btn block" data-open="${i}-${k}" type="button">Pantalla completa para la puerta</button>`:
          `<div class="qr locked">Se activa al aprobar tu pago</div><p class="serial">${ser} · pendiente</p><p class="small muted">Plazo de respuesta: hoy antes de las 9:00 pm. Te avisamos por correo y WhatsApp.</p>`}
        </div>
      </article>`;}).join("")).join("");
  $("#list").innerHTML=html;
  $("#list").addEventListener("click",e=>{
    const b=e.target.closest("[data-open]"); if(!b)return;
    const [i,k]=b.dataset.open.split("-").map(Number), t=T[i], ser=t.ser+"-0"+(k+1);
    $("#d-ev").textContent=t.ev.title+" · "+t.area; $("#d-qr").innerHTML=qrSVG(ser); $("#d-ser").textContent=ser;
    $("#door").showModal();
    motion(g=>g.fromTo("#door .qr",{clipPath:"inset(0 0 100% 0 round 20px)"},{clipPath:"inset(0 0 0% 0 round 20px)",duration:.8,ease:"expo.out"}));
  });
  motion(g=>g.from(".pass",{y:26,autoAlpha:0,duration:.6,ease:"power3.out",stagger:.1,clearProps:"all"}));
})();
</script>
</body>
</html>
